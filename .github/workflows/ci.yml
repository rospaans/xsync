name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile-check xsync
        run: python -m py_compile xsync

      - name: Shellcheck install.sh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck install.sh

      - name: Unit and end-to-end tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests -q

      - name: Smoke test --init, --help, --version, and no sync without a terminal
        shell: bash
        run: |
          set -euo pipefail
          SRC=$(mktemp -d)
          cd "$SRC"
          python "$GITHUB_WORKSPACE/xsync" --help
          python "$GITHUB_WORKSPACE/xsync" --version
          python "$GITHUB_WORKSPACE/xsync" --init
          test -f .xsync.toml
          # xsync is interactive: without a terminal it must refuse to run
          if python "$GITHUB_WORKSPACE/xsync"; then exit 1; fi
