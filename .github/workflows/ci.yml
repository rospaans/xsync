name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install xsync with its test dependencies
        run: python -m pip install --quiet ".[dev]"

      - name: Shellcheck install.sh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck install.sh

      - name: Tests
        run: python -m pytest -q

      - name: Smoke test the installed command
        shell: bash
        run: |
          set -euo pipefail
          SRC=$(mktemp -d)
          cd "$SRC"
          xsync --help
          xsync --version
          xsync --init
          test -f .xsync.toml
          # xsync is interactive: without a terminal it must refuse to run
          if xsync; then exit 1; fi
