name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile-check xsync
        run: python -m py_compile xsync

      - name: Shellcheck install.sh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck install.sh

      - name: Smoke test --init, full sync, single-file dry-run
        shell: bash
        run: |
          set -euo pipefail
          SRC=$(mktemp -d)
          DST=$(mktemp -d)
          cd "$SRC"
          python "$GITHUB_WORKSPACE/xsync" --init
          # -i.bak form is portable across GNU sed (Linux) and BSD sed (macOS)
          sed -i.bak "s|/Volumes/your-volume/your-project/|$DST/|" .xsync.toml
          rm -f .xsync.toml.bak
          echo hello > file.txt
          python "$GITHUB_WORKSPACE/xsync" --dry-run
          python "$GITHUB_WORKSPACE/xsync"
          test -f "$DST/file.txt"
          python "$GITHUB_WORKSPACE/xsync" file.txt --dry-run
